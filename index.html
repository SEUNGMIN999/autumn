  .back::after{
    content:"";position:absolute;inset:.6cqw;
    border:.18cqw dashed rgba(255,246,232,.55);border-radius:.8cqw;
  }
  .back svg{width:22%;height:auto}
  .front{transform:rotateY(180deg)}

  .word{
    display:flex;
    font-family:"Jua",sans-serif;
    font-size:4.4cqw;
    color:var(--ink);
    letter-spacing:.08em;
    line-height:1;
  }
  .ch{position:relative;display:inline-block}

  /* 빨간 동그라미 */
  .ring{
    position:absolute;left:48%;top:52%;
    width:1.4em;height:1.3em;
    transform:translate(-50%,-50%) rotate(-10deg);
    overflow:visible;pointer-events:none;
  }
  .ring path{
    fill:none;stroke:var(--red);stroke-width:5;stroke-linecap:round;
    stroke-dasharray:420;stroke-dashoffset:420;
  }
  .ch.mark .ring path{animation:draw .7s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}

  /* 연필로 쓰는 바른 글자 */
  .fix{
    position:absolute;left:50%;bottom:112%;
    width:.9em;height:.9em;
    transform:translateX(-50%);
    overflow:visible;pointer-events:none;
  }
  .fix svg.letter{width:100%;height:100%;overflow:visible}
  .fix path{
    fill:none;stroke:var(--ink);stroke-width:9;
    stroke-linecap:round;stroke-linejoin:round;
    stroke-dasharray:101;stroke-dashoffset:101;
  }
  .ch:not(.mark) .fix{visibility:hidden}

  .pencil{
    position:absolute;left:0;top:0;
    width:1.05em;height:1.05em;
    overflow:visible;opacity:0;
    transition:opacity .2s;
  }
  .pencil.on{opacity:1}

  /* 버튼 */
  .controls{
    position:absolute;left:50%;top:96.4%;
    transform:translate(-50%,-50%);
    display:flex;gap:1cqw;
  }
  .btn{
    font-size:1.25cqw;font-weight:700;
    padding:.55cqw 1.8cqw;border-radius:999px;
    background:#fffdf7;color:var(--brown);
    box-shadow:0 .2cqw 0 rgba(90,60,30,.25);
    transition:transform .12s, opacity .2s;
  }
  .btn:active{transform:scale(.96)}
  .btn.primary{background:var(--brown);color:#fffdf7}
  .btn[disabled]{opacity:.35;pointer-events:none}

  #stage.page-method #method{display:block}
  .slot{
    position:absolute;left:38.8%;width:29.5%;height:9.35%;
    display:flex;align-items:center;padding-left:2.4cqw;
    cursor:pointer;border-radius:5cqw;
    touch-action:none;
  }
  .slot.s1{top:31.9%}
  .slot.s2{top:51.9%}
  .slot.s3{top:71.9%}
  .txt{
    font-family:"Jua",sans-serif;font-size:4.4cqw;line-height:1;
    letter-spacing:.12em;color:var(--ink);white-space:nowrap;
  }

  /* 암호카드: 도형 암호 + 암호표 */
  .s1 .txt{display:flex;gap:.12em;letter-spacing:0}
  .s1 .txt span{display:inline-flex;align-items:center;justify-content:center;width:1em;height:1em}
  .s1 .txt span img{max-width:1.05em;max-height:.95em}
  .s1 .txt span.flip{animation:cflip .5s ease}
  @keyframes cflip{50%{transform:rotateY(90deg) scale(1.15)}}
  .s1 .txt span.hit{background:#ffe9a8;border-radius:.2em}
  .key{
    position:absolute;left:71.6%;top:26.6%;width:21.8%;height:35%;
    display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1.25fr 1fr 1.25fr 1fr;
    background:#fff;border:.15cqw solid var(--ink);
    box-shadow:.3cqw .3cqw 0 rgba(90,60,30,.18);
    transform:rotate(-1.5deg) translateY(1cqw) scale(.85);opacity:0;
    transition:opacity .4s ease, transform .5s cubic-bezier(.3,1.4,.5,1);
    pointer-events:none;
  }
  .key.on{opacity:1;transform:rotate(-1.5deg)}
  .kc{
    display:flex;align-items:center;justify-content:center;
    border-right:.1cqw solid var(--ink);border-bottom:.1cqw solid var(--ink);
    transition:background .25s;
  }
  .kc:nth-child(4n){border-right:none}
  .kc:nth-last-child(-n+4){border-bottom:none}
  .kc img{max-width:78%;max-height:80%}
  .kc span{font-family:"Jua",sans-serif;font-size:2.2cqw;color:var(--ink)}
  .kc.hit{background:#ffe9a8}

  /* 스크래처 */
  .s2 canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:5cqw;transition:opacity .5s}
  .s2.done canvas{opacity:0;pointer-events:none}
  .coin{
    position:absolute;left:0;top:0;width:4.2cqw;height:4.2cqw;
    transform:translate(-50%,-50%);opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .coin.on{opacity:1}

  /* 비밀펜 */
  .s3 .txt{position:absolute;left:2.4cqw;top:50%;transform:translateY(-50%)}
  .s3 .base{color:transparent}
  .s3 .glow{
    color:#7c3aed;text-shadow:0 0 .12em rgba(167,139,250,.9), 0 0 .3em rgba(139,92,246,.6);
    -webkit-mask-image:radial-gradient(circle at -50% 50%, #000 0, transparent 0);
            mask-image:radial-gradient(circle at -50% 50%, #000 0, transparent 0);
  }
  .s3.done .glow{-webkit-mask-image:none;mask-image:none}
  .uvlight{
    position:absolute;left:0;top:50%;width:9cqw;height:9cqw;
    transform:translate(-50%,-50%);border-radius:50%;pointer-events:none;
    background:radial-gradient(circle, rgba(139,92,246,.30) 0%, rgba(139,92,246,.16) 45%, transparent 70%);
    opacity:0;transition:opacity .25s;
  }
  .uvlight.on{opacity:1}

  /* 돋보기 전환 */
  #dark{position:absolute;inset:0;z-index:6;background:#0d0b0a;display:none}
  #lens{position:absolute;z-index:7;display:none;overflow:visible;pointer-events:none}

<body>
<div id="stage">
  <div id="board"></div>

  <div id="method">
    <div class="slot s1"><span class="txt"></span></div>
    <div class="slot s2"><span class="txt">스크래처</span><canvas></canvas>
      <svg class="coin" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#e2b33c" stroke="#b9861f" stroke-width="6"/><circle cx="50" cy="50" r="30" fill="none" stroke="#f5d77a" stroke-width="5"/></svg>
    </div>
    <div class="slot s3"><span class="txt base">비밀펜</span><span class="txt glow">비밀펜</span><div class="uvlight"></div></div>
  </div>

  <div id="dark"></div>
  <svg id="lens" viewBox="0 0 160 160">
    <circle cx="60" cy="60" r="50" fill="rgba(255,255,255,.06)" stroke="#8a5a2b" stroke-width="9"/>
    <path d="M30 40 A36 36 0 0 1 52 22" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="5" stroke-linecap="round"/>
    <line x1="97" y1="97" x2="148" y2="148" stroke="#5a3a1c" stroke-width="16" stroke-linecap="round"/>
  </svg>

  <div class="controls">
    <button class="btn" id="resetBtn">처음으로</button>
    <button class="btn primary" id="nextBtn">다음</button>
  </div>

  <div id="cover"><button class="btn" id="startBtn">시작</button></div>
</div>

<script>
  // 화면 순서대로 (wrong: 틀린 글자 위치, fix: 바른 글자)
  const WORDS = [
    { text: "은행잎" },
    { text: "단풍잎" },
    { text: "다람쥐" },
    { text: "도토라", wrong: 2, fix: "리" },
    { text: "메뚜기" },
    { text: "솔방알", wrong: 2, fix: "울" },
    { text: "사과" },
    { text: "고구마" },
    { text: "코수모스", wrong: 1, fix: "스" }
  ];
  const COLS = [17.7, 50, 82];
  const ROWS = [33.3, 56.5, 79.6];

  // 바른 글자 획 (획순대로, 100×100 칸)
  const STROKES = {
    "리": [
      "M12 18 L50 18 L50 46",          // ㄱ
      "M13 47 L50 47",                 // ㅡ
      "M13 47 L13 82 L54 82",          // ㄴ
      "M76 8 L76 94"                   // ㅣ
    ],
    "울": [
      "M50 5 A14 13 0 0 0 50 31 A14 13 0 0 0 50 5",  // ㅇ (위에서 시작, 시계 반대 방향)
      "M10 43 L90 43",                 // ㅡ
      "M50 43 L50 57",                 // ㅜ의 ㅣ
      "M22 64 L77 64 L77 79",          // ㄱ
      "M23 79 L77 79",                 // ㅡ
      "M23 79 L23 96 L80 96"           // ㄴ
    ],
    "스": [
      "M50 10 C 46 30, 32 46, 13 58",  // ㅅ 왼쪽 획
      "M47 32 C 56 44, 70 53, 87 58",  // ㅅ 오른쪽 획
      "M8 84 L92 84"                   // ㅡ
    ]
  };

  const LEAF ='<svg viewBox="0 0 100 100"><path fill="rgba(255,246,232,.55)" d="M50 2 L58 22 L70 13 L68 34 L89 27 L80 46 L98 52 L78 61 L85 75 L62 69 L55 86 L52 70 L52 98 L48 98 L48 70 L45 86 L38 69 L15 75 L22 61 L2 52 L20 46 L11 27 L32 34 L30 13 L42 22 Z"/></svg>';
  const RING = '<svg class="ring" viewBox="0 0 120 110"><path d="M64 8 C 100 6, 116 34, 112 58 C 108 88, 80 104, 54 102 C 24 100, 6 78, 8 52 C 10 26, 34 8, 66 10 C 80 11, 90 16, 96 22"/></svg>';
  const PENCIL = `<svg class="pencil" viewBox="0 0 100 100"><g transform="rotate(-45 0 100)">
      <rect x="16" y="93" width="84" height="14" rx="1.5" fill="#f2b632"/>
      <rect x="16" y="98.5" width="84" height="3" fill="#e09a1e"/>
      <rect x="100" y="93" width="7" height="14" fill="#b9b9b9"/>
      <rect x="107" y="93" width="13" height="14" rx="3" fill="#f08a9a"/>
      <polygon points="0,100 16,93 16,107" fill="#f1d3a8"/>
      <polygon points="0,100 6,97.4 6,102.6" fill="#2b2b2b"/>
    </g></svg>`;

  const board = document.getElementById("board");
  const nextBtn = document.getElementById("nextBtn");
  const resetBtn = document.getElementById("resetBtn");
  const cover = document.getElementById("cover");
  const cards = [];

  WORDS.forEach((w, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.style.left = COLS[i % 3] + "%";
    card.style.top = ROWS[Math.floor(i / 3)] + "%";
    const chars = [...w.text].map((c, j) => {
      if (w.wrong !== j) return `<span class="ch">${c}</span>`;
      return `<span class="ch target">${c}${RING}<span class="fix">
          <svg class="letter" viewBox="0 0 100 100">${STROKES[w.fix].map(d => `<path pathLength="100" d="${d}"/>`).join("")}</svg>
          ${PENCIL}
        </span></span>`;
    }).join("");
    card.innerHTML = `
      <div class="inner">
        <div class="face back">${LEAF}</div>
        <div class="face front"><div class="word">${chars}</div></div>
      </div>`;
    board.appendChild(card);
    cards.push(card);
  });

  // 진행 순서: 카드 뒤집기 → (틀린 단어면) 바로 고치기
  const STEPS = [];
  WORDS.forEach((w, i) => {
    STEPS.push({ type: "show", i });
    if (w.wrong !== undefined) STEPS.push({ type: "fix", i });
  });
  let busy = false;

  const isDone = s => s.type === "show"
    ? cards[s.i].classList.contains("show")
    : cards[s.i].querySelector(".target").classList.contains("mark");
  const nextStep = () => STEPS.find(s => !isDone(s));

  // 연필로 한 획씩 쓰기
  const SPEED = 150;      // 1초에 그리는 길이(칸 단위)
  const PAUSE = 160;      // 획 사이 쉬는 시간(ms)

  function clearLetter(t) {
    t._gen = (t._gen || 0) + 1;
    t.querySelectorAll(".letter path").forEach(p => { p.style.strokeDashoffset = 101; });
    t.querySelector(".pencil").classList.remove("on");
  }

  function writeLetter(t) {
    const gen = ++t._gen;
    const paths = [...t.querySelectorAll(".letter path")];
    const pencil = t.querySelector(".pencil");
    const fix = t.querySelector(".fix");
    const movePencil = (x, y) => {
      const k = fix.clientWidth / 100;            // 칸 → 픽셀
      pencil.style.transform = `translate(${x * k}px, ${y * k - pencil.clientHeight}px)`;
    };
    const first = paths[0].getPointAtLength(0);
    movePencil(first.x, first.y);
    pencil.classList.add("on");

    let idx = 0;
    const drawNext = () => {
      if (gen !== t._gen) return;
      if (idx >= paths.length) { setTimeout(() => gen === t._gen && pencil.classList.remove("on"), 250); return; }
      const p = paths[idx++];
      const L = p.getTotalLength();
      const dur = Math.max(260, L / SPEED * 1000);
      const t0 = performance.now();
      const frame = now => {
        if (gen !== t._gen) return;
        const r = Math.min(1, Math.max(0, now - t0) / dur);
        const e = r < .5 ? 2 * r * r : 1 - Math.pow(-2 * r + 2, 2) / 2;
        p.style.strokeDashoffset = 101 * (1 - e);
        const pt = p.getPointAtLength(L * e);
        movePencil(pt.x, pt.y);
        if (r < 1) requestAnimationFrame(frame);
        else setTimeout(drawNext, PAUSE);
      };
      requestAnimationFrame(frame);
    };
    setTimeout(drawNext, 750);                   // 동그라미 그린 뒤 시작
  }

  function run(s) {
    const card = cards[s.i];
    if (s.type === "show") card.classList.add("show");
    else {
      const t = card.querySelector(".target");
      if (!t.classList.contains("mark")) { t.classList.add("mark"); writeLetter(t); }
    }
    update();
  }

  // 다음 버튼: 아직 안 한 단계 중 첫 번째 → 다 끝나면 '찾는 방법' 장으로
  function advance() {
    if (busy) return;
    if (page === "method") return methodNext();
    const s = nextStep();
    if (!s) return toMethod();
    busy = true;
    setTimeout(() => { busy = false; }, s.type === "show" ? 700 : 1500);
    run(s);
  }

  // 카드 직접 누르기: 뒤집기 → (틀린 단어면) 한 번 더 누르면 고치기
  cards.forEach((card, i) => {
    card.addEventListener("click", () => {
      if (!card.classList.contains("show")) return run({ type: "show", i });
      if (WORDS[i].wrong !== undefined) run({ type: "fix", i });
    });
  });

  /* ---------- 가을 단어 찾는 방법 ---------- */
  const stage = document.getElementById("stage");
  const dark = document.getElementById("dark");
  const lens = document.getElementById("lens");
  const slots = [...document.querySelectorAll(".slot")];
  const done = [false, false, false];
  let page = "words";
  let mgen = 0;                                   // 진행 중인 효과 끊기용

  function update() {
    nextBtn.disabled = page === "method" && done.every(Boolean);
  }

  // 돋보기 전환: 검은 화면을 돋보기가 뒤지며 아래가 보임
  function toMethod() {
    busy = true;
    page = "method";
    stage.classList.add("page-method");
    resetMethod();
    dark.style.display = "block";
    lens.style.display = "block";
    lens.style.opacity = 1;
    const W = stage.clientWidth, H = stage.clientHeight;
    const pts = [[-8, 70], [22, 38], [50, 30], [78, 42], [62, 68], [30, 72], [50, 52]];
    const SEG = 620, GROW = 900;
    const R0 = W * 0.085, R1 = Math.hypot(W, H);
    const ease = r => r < .5 ? 2 * r * r : 1 - Math.pow(-2 * r + 2, 2) / 2;
    const t0 = performance.now();
    const total = SEG * (pts.length - 1) + GROW;
    const frame = now => {
      const el = Math.max(0, now - t0);
      let x, y, r = R0;
      if (el < SEG * (pts.length - 1)) {
        const k = Math.floor(el / SEG), f = ease((el % SEG) / SEG);
        x = pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f;
        y = pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f;
      } else {
        const g = Math.min(1, (el - SEG * (pts.length - 1)) / GROW);
        [x, y] = pts[pts.length - 1];
        r = R0 + (R1 - R0) * ease(g);
        lens.style.opacity = 1 - g * 1.6;
      }
      const px = x / 100 * W, py = y / 100 * H;
      const m = `radial-gradient(circle at ${px}px ${py}px, transparent ${r}px, #000 ${r + 1.5}px)`;
      dark.style.webkitMaskImage = m; dark.style.maskImage = m;
      const S = r * 3.2;                          // 렌즈 반지름 50/160 기준
      if (el < total - GROW) {
        lens.style.width = lens.style.height = S + "px";
        lens.style.left = (px - S * 60 / 160) + "px";
        lens.style.top = (py - S * 60 / 160) + "px";
      }
      if (el < total) requestAnimationFrame(frame);
      else { dark.style.display = "none"; lens.style.display = "none"; busy = false; update(); }
    };
    requestAnimationFrame(frame);
  }

  function methodNext() {
    const i = done.indexOf(false);
    if (i === 0) revealCipher();
    else if (i === 1) autoScratch();
    else if (i === 2) sweepUV();
  }

  const keyCells = [...keyEl.children];

  function lockCipher() {
    cTxt.className = "txt";
    cTxt.innerHTML = CODE.map(([s]) => `<span>${svgOf(s)}</span>`).join("");

    keyCells.forEach(c => c.classList.remove("hit"));
  }
  function revealCipher() {
    if (done[0]) return;
    done[0] = true; update();
    busy = true;

    const spans = [...cTxt.children];
    keyEl.classList.add("on");

    CODE.forEach(([shape, ch], k) => {

      const t = 700 + k * 900;

        spans[k].classList.add("hit");
      });
      later(t + 450, () => { spans[k].classList.add("flip"); });
      later(t + 700, () => { spans[k].textContent = ch; spans[k].classList.remove("hit"); });
    });
    later(700 + CODE.length * 900, () => { keyCells.forEach(c => c.classList.remove("hit")); busy = false; });
  }
  slots[0].addEventListener("click", revealCipher);

  // 2. 스크래처: 은박을 긁어서 글자 보기 (손으로 긁기 + 동전 자동 긁기)
  const sSlot = slots[1], cv = sSlot.querySelector("canvas"), ctx = cv.getContext("2d");
  const coin = sSlot.querySelector(".coin");
  let scratchCount = 0, lastPt = null;
  function paintCoating() {
    const dpr = window.devicePixelRatio || 1;
    cv.width = Math.round(sSlot.clientWidth * dpr);
    cv.height = Math.round(sSlot.clientHeight * dpr);
    const w = cv.width, h = cv.height;
    ctx.globalCompositeOperation = "source-over";
    const g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, "#b8b8b8"); g.addColorStop(.35, "#e8e8e8");
    g.addColorStop(.6, "#c4c4c4"); g.addColorStop(1, "#dcdcdc");
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = h * .05;
    for (let x = -h; x < w; x += h * .35) { ctx.beginPath(); ctx.moveTo(x, h); ctx.lineTo(x + h, 0); ctx.stroke(); }
    ctx.fillStyle = "rgba(140,140,140,.35)";
    for (let k = 0; k < 140; k++) ctx.fillRect(Math.random() * w, Math.random() * h, 2 * dpr, 2 * dpr);
  }
  function scratchTo(x, y) {                     // 칸 기준 0~1 좌표
    const px = x * cv.width, py = y * cv.height;
    ctx.globalCompositeOperation = "destination-out";
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.lineWidth = cv.height * .42;
    ctx.beginPath();
    const from = lastPt || [px, py];
    ctx.moveTo(from[0], from[1]); ctx.lineTo(px + .1, py);
    ctx.stroke();
    lastPt = [px, py];
    if (++scratchCount % 12 === 0) checkScratch();
  }
  function checkScratch() {
    if (done[1]) return;
    const d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    let clear = 0, n = 0;
    for (let k = 3; k < d.length; k += 4 * 16) { n++; if (d[k] < 40) clear++; }
    if (clear / n > .55) finishScratch();
  }
  function finishScratch() {
    if (done[1]) return;
    done[1] = true; sSlot.classList.add("done"); coin.classList.remove("on"); update();
  }
  const rel = e => {
    const r = sSlot.getBoundingClientRect();
    return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height];
  };
  let drawing = false;
  sSlot.addEventListener("pointerdown", e => {
    if (done[1]) return;
    drawing = true; lastPt = null; sSlot.setPointerCapture(e.pointerId); scratchTo(...rel(e));
  });
  sSlot.addEventListener("pointermove", e => { if (drawing && !done[1]) scratchTo(...rel(e)); });
  const stopDraw = () => { drawing = false; lastPt = null; checkScratch(); };
  sSlot.addEventListener("pointerup", stopDraw);
  sSlot.addEventListener("pointercancel", stopDraw);

  function autoScratch() {
    if (done[1]) return;
    busy = true;
    const gen = mgen;
    const pts = [];
    for (let k = 0; k <= 8; k++) pts.push([.04 + k * .115, k % 2 ? .82 : .18]);
    for (let k = 8; k >= 0; k--) pts.push([.04 + k * .115, .5]);
    const SEG = 120, t0 = performance.now();
    lastPt = null; coin.classList.add("on");
    const frame = now => {
      if (gen !== mgen) return;
      const el = Math.max(0, now - t0), k = Math.floor(el / SEG);
      if (k >= pts.length - 1) { busy = false; finishScratch(); return; }
      const f = (el % SEG) / SEG;
      const x = pts[k][0] + (pts[k + 1][0] - pts[k][0]) * f;
      const y = pts[k][1] + (pts[k + 1][1] - pts[k][1]) * f;
      scratchTo(x, y);
      coin.style.left = x * 100 + "%"; coin.style.top = y * 100 + "%";
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  }

  // 3. 비밀펜: 보라색 불빛이 지나가면 숨은 글자가 빛남
  const uSlot = slots[2], glow = uSlot.querySelector(".glow"), uv = uSlot.querySelector(".uvlight");
  function setGlowMask(x, y, r) {
    const m = `radial-gradient(circle at ${x}px ${y}px, #000 ${r * .55}px, transparent ${r}px)`;
    glow.style.webkitMaskImage = m; glow.style.maskImage = m;
  }
  function sweepUV() {
    if (done[2]) return;
    busy = true; done[2] = true; update();
    const gen = mgen;
    const W = uSlot.clientWidth, H = uSlot.clientHeight, R = uv.clientWidth / 2;
    const gx = glow.offsetLeft, gy = glow.offsetTop - glow.offsetHeight / 2;
    const DUR = 2200, t0 = performance.now();
    uv.classList.add("on");
    const frame = now => {
      if (gen !== mgen) return;
      const r = Math.min(1, Math.max(0, now - t0) / DUR);
      const x = W * (-.05 + 1.0 * r), y = H * (.5 + Math.sin(r * Math.PI * 3) * .18);
      uv.style.left = x + "px"; uv.style.top = y + "px";
      setGlowMask(x - gx, y - gy, R);
      if (r < 1) requestAnimationFrame(frame);
      else { uv.classList.remove("on"); uSlot.classList.add("done"); glow.style.webkitMaskImage = glow.style.maskImage = "none"; busy = false; }
    };
    requestAnimationFrame(frame);
  }
  uSlot.addEventListener("click", sweepUV);

  function resetMethod() {
    mgen++;
    done.fill(false);
    lockCipher();
    sSlot.classList.remove("done"); coin.classList.remove("on"); scratchCount = 0; lastPt = null;
    paintCoating();
    uSlot.classList.remove("done"); uv.classList.remove("on");
    glow.style.webkitMaskImage = glow.style.maskImage = "";
  }

  function reset() {
    busy = false;
    page = "words";
    stage.classList.remove("page-method");
    mgen++;
    dark.style.display = "none"; lens.style.display = "none";
    cards.forEach(c => {
      c.classList.remove("show");
      const t = c.querySelector(".target");
      if (t) { t.classList.remove("mark"); clearLetter(t); }
    });
    update();
  }
  document.querySelectorAll(".target").forEach(clearLetter);

  const onCover = () => !cover.classList.contains("hide");
  function start() { cover.classList.add("hide"); }
  function toCover() { reset(); cover.classList.remove("hide"); }

  cover.addEventListener("click", start);
  nextBtn.addEventListener("click", advance);
  resetBtn.addEventListener("click", toCover);
  document.addEventListener("keydown", e => {
    if (["Space", "ArrowRight", "Enter", "PageDown"].includes(e.code)) {
      e.preventDefault();
      onCover() ? start() : advance();
    } else if (e.key === "r" || e.key === "R") toCover();
  });

  update();
</script>
</body>
</html>
